  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-elevated: #1a2234;
      --border: #232f48;
      --border-subtle: #192338;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --indigo: #818cf8;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, monospace;
    }

    html.light {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-elevated: #f1f5f9;
      --border: #cbd5e1;
      --border-subtle: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.1);
      --emerald: #059669;
      --amber: #d97706;
      --rose: #e11d48;
      --indigo: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Header Bar */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent);
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #03111e;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: #7dd3fc;
      color: #03111e;
    }

    /* Sub-nav Tab Bar */
    .tab-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text);
      background: var(--surface-elevated);
    }

    .tab-btn.active {
      color: var(--text);
      background: var(--surface-elevated);
      border-color: var(--border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .tab-btn .num {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--border);
      color: var(--text);
    }

    .tab-btn.active .num {
      background: var(--accent);
      color: #03111e;
      font-weight: 700;
    }

    /* Toolbar for Zoom & Export */
    .toolbar {
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(17, 24, 39, 0.4);
    }

    .diagram-info h2 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diagram-info p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 10px;
      font-size: 12px;
      font-family: var(--font-mono);
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .control-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    /* Diagram Stage & Canvas */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
      background: 
        radial-gradient(circle at 1px 1px, var(--border-subtle) 1px, transparent 0);
      background-size: 24px 24px;
      min-height: 640px;
    }

    .svg-wrapper {
      transform-origin: center center;
      transition: transform 0.15s ease-out;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      padding: 24px;
      max-width: 100%;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1100px;
    }

    /* SVG Editorial Styles */
    .hairline {
      stroke-width: 1;
    }
    .grid-node {
      transition: filter 0.2s ease;
    }
    .grid-node:hover {
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    /* Toast notification */
    #copy-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface-elevated);
      color: var(--emerald);
      border: 1px solid var(--emerald);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 100;
    }
  </style>

    let currentIdx = 0;
    let currentZoom = 1;

    function renderCurrentDiagram() {
      const diag = DIAGRAMS[currentIdx];
      document.getElementById('diag-title').textContent = diag.title;
      document.getElementById('diag-desc').textContent = diag.desc;
      document.getElementById('svg-container').innerHTML = diag.svg;
      
      const tabBtns = document.querySelectorAll('.tab-btn');
      tabBtns.forEach((btn, idx) => {
        if (idx === currentIdx) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      zoomReset();
    }

    function switchDiagram(idx) {
      currentIdx = idx;
      renderCurrentDiagram();
    }

    function zoomIn() {
      currentZoom = Math.min(2.5, currentZoom + 0.15);
      applyZoom();
    }

    function zoomOut() {
      currentZoom = Math.max(0.5, currentZoom - 0.15);
      applyZoom();
    }

    function zoomReset() {
      currentZoom = 1;
      applyZoom();
    }

    function applyZoom() {
      const wrapper = document.getElementById('svg-wrapper');
      wrapper.style.transform = `scale(${currentZoom})`;
      document.getElementById('zoom-level').textContent = `${Math.round(currentZoom * 100)}%`;
    }

    function copySvgCode() {
      const svg = DIAGRAMS[currentIdx].svg;
      navigator.clipboard.writeText(svg).then(() => {
        showToast();
      }).catch(err => {
        console.error('Copy failed', err);
      });
    }

    function downloadCurrentSvg() {
      const diag = DIAGRAMS[currentIdx];
      const blob = new Blob([diag.svg], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `diagram_design_${currentIdx + 1}.svg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      if (isDark) {
        html.classList.remove('dark');
        html.classList.add('light');
        document.getElementById('theme-icon').textContent = '🌙';
        document.getElementById('theme-btn').childNodes[2].textContent = ' 深色模式';
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        document.getElementById('theme-icon').textContent = '☀️';
        document.getElementById('theme-btn').childNodes[2].textContent = ' 明亮模式';
      }
    }

    function showToast() {
      const toast = document.getElementById('copy-toast');
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2500);
    }

    // 初始化渲染第一張
    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentDiagram();
