<svg viewBox="0 0 1060 620" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Windows 11 健康休息提醒系統架構圖">
  <defs>
    <marker id="dd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="dd-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="dd-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- LAYER 1: HARDWARE & OS LAYER -->
  <g>
    <rect x="30" y="30" width="220" height="560" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <rect x="30" y="30" width="220" height="36" rx="8" fill="#1e293b" />
    <text x="44" y="53" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 01 : OS &amp; HARDWARE</text>
    
    <rect x="46" y="80" width="188" height="90" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="58" y="104" fill="#f8fafc" font-size="13" font-weight="600">鍵盤與滑鼠實體操作</text>
    <text x="58" y="122" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">USER PHYSICAL I/O</text>
    <rect x="58" y="134" width="70" height="20" rx="3" fill="#1e293b"/>
    <text x="64" y="148" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10">0 隱私側錄</text>

    <rect x="46" y="190" width="188" height="100" rx="6" fill="#0b1120" stroke="#0284c7" stroke-width="1.2"/>
    <text x="58" y="214" fill="#38bdf8" font-size="13" font-weight="700">Win32 輸入活動監聽</text>
    <text x="58" y="232" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">GetLastInputInfo()</text>
    <text x="58" y="250" fill="#94a3b8" font-size="11">GetTickCount64 溢位防護</text>
    <rect x="58" y="260" width="130" height="18" rx="3" fill="#0369a1" fill-opacity="0.2"/>
    <text x="64" y="273" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10">POLL: 1000ms / Tick</text>

    <rect x="46" y="310" width="188" height="110" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="58" y="334" fill="#f8fafc" font-size="13" font-weight="600">系統工作階段與電源</text>
    <text x="58" y="352" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">WM_WTSSESSION_CHANGE</text>
    <text x="58" y="370" fill="#94a3b8" font-size="11">鎖定 Win+L / 解鎖</text>
    <text x="58" y="388" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">WM_POWERBROADCAST</text>
    <text x="58" y="404" fill="#94a3b8" font-size="11">睡眠 Sleep / 喚醒 Resume</text>

    <rect x="46" y="440" width="188" height="70" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="58" y="464" fill="#f8fafc" font-size="13" font-weight="600">單一執行個體鎖</text>
    <text x="58" y="482" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">CreateMutexW</text>
    <text x="58" y="498" fill="#94a3b8" font-size="11">防重複啟動 (Named Mutex)</text>

    <rect x="46" y="525" width="188" height="50" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="58" y="546" fill="#f8fafc" font-size="12" font-weight="600">開機自啟動管理</text>
    <text x="58" y="562" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">HKCU\...\Run</text>
  </g>

  <!-- LAYER 2: CORE TIMING ENGINE & STATE MACHINE -->
  <g>
    <rect x="290" y="30" width="370" height="560" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <rect x="290" y="30" width="370" height="36" rx="8" fill="#1e293b" />
    <text x="306" y="53" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 02 : CORE TIMING ENGINE &amp; 11-STATE MACHINE</text>

    <rect x="306" y="80" width="338" height="75" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="320" y="104" fill="#f8fafc" font-size="13" font-weight="600">獨立單調時鐘 (Monotonic Clock)</text>
    <text x="320" y="122" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">time.monotonic() · 免疫系統時間修改</text>
    <text x="320" y="140" fill="#94a3b8" font-size="11">防篡改精度累加，支援單元測試 MockClock 注入</text>

    <rect x="306" y="170" width="338" height="150" rx="6" fill="#0b1120" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="320" y="194" fill="#38bdf8" font-size="13" font-weight="700">三段式閒置容錯仲裁器 (3-Tier Idle Arbiter)</text>
    
    <rect x="320" y="206" width="310" height="26" rx="4" fill="#1e293b"/>
    <text x="328" y="223" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="10">Burst Window ≤ 2.0s</text>
    <text x="490" y="223" fill="#94a3b8" font-size="11">有輸入時逐秒累計有效秒數</text>

    <rect x="320" y="238" width="310" height="32" rx="4" fill="#1e293b"/>
    <text x="328" y="253" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10">短暫閒置 (0~5m)</text>
    <text x="445" y="253" fill="#f8fafc" font-size="11">看手機容錯：進度完全保留，零增加</text>
    <text x="328" y="266" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="9">PRESERVE_ACCUMULATED_PROGRESS_WITHOUT_IDLE_SECONDS</text>

    <rect x="320" y="276" width="310" height="32" rx="4" fill="#1e293b"/>
    <text x="328" y="291" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="10">一般與長時間閒置</text>
    <text x="445" y="291" fill="#94a3b8" font-size="11">5~15m 凍結保留 / &gt;15m 寫入事件紀錄</text>
    <text x="328" y="303" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="9">EVENT_LOGGING_TO_SQLITE_HISTORY</text>

    <rect x="306" y="335" width="338" height="150" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="320" y="358" fill="#f8fafc" font-size="13" font-weight="600">11 種核心狀態機 (Finite State Machine)</text>
    
    <g transform="translate(320, 370)">
      <rect x="0" y="0" width="70" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="16" fill="#a7f3d0" font-family="JetBrains Mono, monospace" font-size="10">ACTIVE</text>

      <rect x="76" y="0" width="85" height="24" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
      <text x="82" y="16" fill="#fde68a" font-family="JetBrains Mono, monospace" font-size="9">SHORT_IDLE</text>

      <rect x="167" y="0" width="70" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="175" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="9">INACTIVE</text>

      <rect x="243" y="0" width="67" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="248" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="9">LONG_IDLE</text>
    </g>

    <g transform="translate(320, 400)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1"/>
      <text x="8" y="16" fill="#fecdd3" font-family="JetBrains Mono, monospace" font-size="10">BREAK_DUE</text>

      <rect x="91" y="0" width="95" height="24" rx="4" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
      <text x="96" y="16" fill="#c7d2fe" font-family="JetBrains Mono, monospace" font-size="9">BREAK_PAUSED</text>

      <rect x="192" y="0" width="55" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="199" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="9">PAUSED</text>

      <rect x="253" y="0" width="57" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="261" y="16" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="9">LOCKED</text>
    </g>

    <g transform="translate(320, 430)">
      <rect x="0" y="0" width="85" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="10" y="15" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="9">SUSPENDED</text>

      <rect x="91" y="0" width="70" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="100" y="15" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="9">RESUMING</text>

      <rect x="167" y="0" width="65" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="178" y="15" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="9">STOPPED</text>
    </g>
    <text x="320" y="475" fill="#64748b" font-size="11">狀態變更觸發回呼、UI 儀表板與系統匣即時同步</text>

    <rect x="306" y="500" width="338" height="75" rx="6" fill="#0b1120" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="320" y="522" fill="#f8fafc" font-size="13" font-weight="600">45 分鐘達標判定 (Break Evaluation)</text>
    <text x="320" y="540" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="10">IF (cycle_active_seconds &gt;= 2700s) -&gt; TRIGGER</text>
    <text x="320" y="558" fill="#94a3b8" font-size="11">凍結累計、產生 UUID 單一事件標記，發送通知</text>
  </g>

  <!-- LAYER 3: NOTIFICATION & UI LAYER -->
  <g>
    <rect x="700" y="30" width="330" height="280" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <rect x="700" y="30" width="330" height="36" rx="8" fill="#1e293b" />
    <text x="716" y="53" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 03 : NOTIFICATION &amp; DESKTOP UI</text>

    <rect x="716" y="80" width="298" height="65" rx="6" fill="#0b1120" stroke="#f59e0b" stroke-width="1"/>
    <text x="730" y="104" fill="#f8fafc" font-size="13" font-weight="600">Windows 11 Toast 橫幅通知</text>
    <text x="730" y="122" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">windows-toasts + WinRT PowerShell Fallback</text>
    <text x="730" y="136" fill="#94a3b8" font-size="11">系統原生音效、單一 ID 替換避免通知轟炸</text>

    <rect x="716" y="155" width="298" height="140" rx="6" fill="#0b1120" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="730" y="178" fill="#38bdf8" font-size="13" font-weight="700">桌面強提醒置頂彈窗 (5 大處置按鈕)</text>
    <text x="730" y="196" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">PySide6 BreakDialog (Qt.WindowStaysOnTopHint)</text>

    <g transform="translate(730, 205)">
      <rect x="0" y="0" width="130" height="20" rx="3" fill="#064e3b"/>
      <text x="6" y="14" fill="#34d399" font-size="10" font-weight="600">1. 已完成休息 (重設)</text>

      <rect x="140" y="0" width="130" height="20" rx="3" fill="#451a03"/>
      <text x="146" y="14" fill="#fbbf24" font-size="10" font-weight="600">2. 稍後 5 分鐘 (貪睡)</text>

      <rect x="0" y="26" width="130" height="20" rx="3" fill="#1e1b4b"/>
      <text x="6" y="40" fill="#a5b4fc" font-size="10" font-weight="600">3. 我正在休息 (碼錶)</text>

      <rect x="140" y="26" width="130" height="20" rx="3" fill="#1f2937"/>
      <text x="146" y="40" fill="#cbd5e1" font-size="10" font-weight="600">4. 關閉 (保留待處置)</text>

      <rect x="0" y="52" width="130" height="20" rx="3" fill="#1f2937"/>
      <text x="6" y="66" fill="#cbd5e1" font-size="10" font-weight="600">5. 暫停提醒</text>
    </g>
  </g>

  <!-- LAYER 4: STORAGE & PERSISTENCE LAYER -->
  <g>
    <rect x="700" y="330" width="330" height="260" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1" />
    <rect x="700" y="330" width="330" height="36" rx="8" fill="#1e293b" />
    <text x="716" y="353" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 04 : LOCAL STORAGE &amp; AUDIT</text>

    <rect x="716" y="380" width="298" height="85" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="730" y="404" fill="#f8fafc" font-size="13" font-weight="600">本機設定檔原子寫入 (Atomic JSON)</text>
    <text x="730" y="422" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">config.json.tmp -&gt; os.replace()</text>
    <text x="730" y="438" fill="#94a3b8" font-size="11">斷電與當機防損壞，儲存門檻、開機設定</text>
    <text x="730" y="454" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">%APPDATA%\Win11BreakReminder\</text>

    <rect x="716" y="480" width="298" height="95" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2"/>
    <text x="730" y="504" fill="#10b981" font-size="13" font-weight="700">歷史紀錄資料庫 (SQLite 3)</text>
    <text x="730" y="522" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10">history.db · WAL 模式</text>
    <text x="730" y="538" fill="#94a3b8" font-size="11">daily_summary (每日累計/休息次數)</text>
    <text x="730" y="554" fill="#94a3b8" font-size="11">events_log (長時間閒置/達標處置紀錄)</text>
  </g>

  <!-- CONNECTORS -->
  <path d="M 234 240 L 270 240 L 270 230 L 304 230" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#dd-arrow)"/>
  <path d="M 234 365 L 270 365 L 270 410 L 304 410" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#dd-arrow)"/>
  <path d="M 644 535 L 675 535 L 675 220 L 698 220" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#dd-arrow)"/>
  <path d="M 644 535 L 675 535 L 675 110 L 714 110" fill="none" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#dd-amber)"/>
  <path d="M 644 380 L 675 380 L 675 420 L 714 420" fill="none" stroke="#10b981" stroke-width="1.2" marker-end="url(#dd-emerald)"/>
  <path d="M 644 550 L 675 550 L 675 530 L 714 530" fill="none" stroke="#10b981" stroke-width="1.2" marker-end="url(#dd-emerald)"/>

  <rect x="242" y="218" width="55" height="16" rx="3" fill="#0c1829" stroke="#0284c7" stroke-width="0.8"/>
  <text x="246" y="230" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="9">Delta T</text>

  <rect x="652" y="300" width="40" height="16" rx="3" fill="#1c1917" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="656" y="312" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="9">45m</text>
</svg>